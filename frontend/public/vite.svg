<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Bharat LawBot Logo</title>
  <desc id="desc">
    Circular violet-blue logo with a stylised Ashoka Stambha and Ashoka Chakra.
  </desc>

  <!-- Background circle with soft violet / indigo gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="45%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Gold-ish accent for base details -->
    <linearGradient id="accentGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <circle
    cx="32"
    cy="32"
    r="30"
    fill="url(#bgGradient)"
  />

  <!-- Stylised Ashoka Stambha group -->
  <g transform="translate(32 32)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central pillar -->
    <rect
      x="-4"
      y="-10"
      width="8"
      height="16"
      rx="2"
      fill="#ffffff"
      stroke="#e5e7eb"
      stroke-width="1"
    />

    <!-- Capital (three lions stylised as arcs) -->
    <path
      d="M -8 -11 C -4 -16 4 -16 8 -11"
      fill="#ffffff"
      stroke="#e5e7eb"
      stroke-width="1.2"
    />
    <path
      d="M -6 -11.5 C -3 -14.5 3 -14.5 6 -11.5"
      fill="none"
      stroke="#e5e7eb"
      stroke-width="1"
    />

    <!-- Small central crown above capital -->
    <path
      d="M -3 -13.5 L 0 -16 L 3 -13.5 Z"
      fill="#ffffff"
      stroke="#e5e7eb"
      stroke-width="0.8"
    />

    <!-- Ashoka Chakra just below capital on pillar -->
    <circle
      cx="0"
      cy="-3"
      r="4"
      fill="none"
      stroke="#6366f1"
      stroke-width="1.3"
    />
    <!-- Chakra spokes -->
    <line x1="0" y1="-7" x2="0" y2="1" stroke="#6366f1" stroke-width="0.9" />
    <line x1="-3" y1="-5.5" x2="3" y2="-0.5" stroke="#6366f1" stroke-width="0.8" />
    <line x1="3" y1="-5.5" x2="-3" y2="-0.5" stroke="#6366f1" stroke-width="0.8" />
    <line x1="-4" y1="-3" x2="4" y2="-3" stroke="#6366f1" stroke-width="0.8" />

    <!-- Abacus / base platform -->
    <rect
      x="-10"
      y="6"
      width="20"
      height="3"
      rx="1.5"
      fill="url(#accentGold)"
      stroke="#fbbf24"
      stroke-width="0.8"
    />
    <!-- Lower circular base (Dharma Chakra / lotus hint) -->
    <ellipse
      cx="0"
      cy="11"
      rx="9"
      ry="3"
      fill="#fff7ed"
      stroke="#fed7aa"
      stroke-width="0.8"
    />
    <ellipse
      cx="0"
      cy="11"
      rx="5"
      ry="1.7"
      fill="none"
      stroke="#fdba74"
      stroke-width="0.7"
    />
  </g>
</svg>
